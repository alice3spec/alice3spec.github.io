<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:," />
    <title>Echo Show ダッシュボード</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0b1220;
        color: #ffffff;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP",
          "Yu Gothic", Meiryo, Roboto, "Droid Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* ---------- background ---------- */
      .bg {
        position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background-image: url("assets/dashboard-wallpaper.jpg");
        background-size: cover;
        background-position: center;
        z-index: 0;
      }
      .bg-shade {
        position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: linear-gradient(100deg,
          rgba(4, 10, 24, 0.78) 0%, rgba(4, 10, 24, 0.62) 55%,
          rgba(4, 10, 24, 0.45) 100%);
        z-index: 1;
      }

      /* ---------- dashboard layout ---------- */
      .dash {
        position: relative; z-index: 2;
        display: flex; flex-direction: row;
        width: 100%; height: 100%;
        padding: 14px 18px 10px 22px;
      }
      .left {
        width: 48%;
        display: flex; flex-direction: column;
        justify-content: flex-start;
        padding-right: 18px;
        min-width: 0;
      }
      .right {
        width: 52%;
        display: flex; flex-direction: column;
        min-width: 0;
      }

      /* clock */
      .clock {
        font-size: 92px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 3px 14px rgba(0,0,0,0.55);
        margin-top: 0;
      }
      .clock .sec {
        font-size: 32px; font-weight: 600;
        color: rgba(255,255,255,0.75);
        margin-left: 8px;
      }
      .date-line {
        font-size: 26px; font-weight: 600;
        margin-top: 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.55);
      }

      /* weather */
      .weather { margin-top: 13px; }
      .wx-now {
        display: flex; align-items: center;
      }
      .wx-icon { font-size: 48px; line-height: 1; margin-right: 12px; }
      .wx-temp {
        font-size: 52px; font-weight: 700; line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      }
      .wx-side { margin-left: 14px; }
      .wx-cond { font-size: 21px; font-weight: 600; }
      .wx-place { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 2px; }
      .wx-hilo {
        font-size: 17px; margin-top: 7px;
        font-variant-numeric: tabular-nums;
      }
      .wx-hilo .hi { color: #ffb3a0; font-weight: 700; }
      .wx-hilo .lo { color: #a8ccff; font-weight: 700; }
      .wx-hours {
        display: flex; flex-direction: row;
        margin-top: 10px;
        max-width: 430px;
      }
      .wx-hour {
        flex: 1 1 0;
        text-align: center;
        background: rgba(6, 14, 30, 0.38);
        border-radius: 10px;
        padding: 5px 0 4px;
        margin-right: 7px;
      }
      .wx-hour:last-child { margin-right: 0; }
      .wx-hour .h-time { font-size: 13px; color: rgba(255,255,255,0.85); }
      .wx-hour .h-icon { font-size: 21px; line-height: 1.25; }
      .wx-hour .h-temp { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .wx-err { font-size: 16px; color: rgba(255,255,255,0.75); margin-top: 14px; }

      /* ---------- news panel ---------- */
      .panel {
        flex: 1 1 auto;
        display: flex; flex-direction: column;
        background: rgba(5, 12, 26, 0.58);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 14px;
        overflow: hidden;
        min-height: 0;
      }
      .tabs {
        display: flex; flex-direction: row;
        border-bottom: 1px solid rgba(255,255,255,0.14);
        flex: 0 0 auto;
      }
      .tab {
        flex: 1 1 0;
        min-height: 46px;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 600;
        white-space: nowrap;
        color: rgba(255,255,255,0.72);
        background: transparent;
        border: none; border-right: 1px solid rgba(255,255,255,0.08);
        padding: 10px 2px;
        cursor: pointer;
        font-family: inherit;
      }
      .tab:last-child { border-right: none; }
      .tab.active {
        color: #ffffff;
        background: rgba(255,255,255,0.14);
        box-shadow: inset 0 -3px 0 #ffd166;
      }
      .news-list {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        min-height: 0;
      }
      .news-item {
        display: block; width: 100%;
        text-align: left;
        background: transparent; border: none;
        border-bottom: 1px solid rgba(255,255,255,0.09);
        padding: 11px 14px 10px;
        cursor: pointer;
        color: #ffffff;
        font-family: inherit;
        min-height: 48px;
      }
      .news-item:active { background: rgba(255,255,255,0.12); }
      .news-title {
        font-size: 17px; line-height: 1.4; font-weight: 600;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .news-meta {
        margin-top: 3px;
        font-size: 13px; color: rgba(255,255,255,0.66);
        display: flex; flex-direction: row;
      }
      .news-src { margin-left: 10px; color: rgba(255,209,102,0.9); }
      .news-msg {
        padding: 22px 16px;
        font-size: 16px; line-height: 1.6;
        color: rgba(255,255,255,0.85);
      }
      .foot {
        flex: 0 0 auto;
        padding: 7px 14px 8px;
        font-size: 13px; color: rgba(255,255,255,0.6);
        text-align: right;
        border-top: 1px solid rgba(255,255,255,0.09);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- article view ---------- */
      .article {
        position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        background: #101623;
      }
      .article.open { display: flex; }
      .art-bar {
        flex: 0 0 auto;
        display: flex; flex-direction: row; align-items: center;
        background: #182238;
        padding: 6px 10px;
        min-height: 56px;
      }
      .back-btn {
        flex: 0 0 auto;
        min-height: 44px; min-width: 96px;
        font-size: 18px; font-weight: 700;
        color: #ffffff;
        background: #2c4a7c;
        border: none; border-radius: 9px;
        padding: 8px 14px;
        cursor: pointer;
        font-family: inherit;
      }
      .art-title {
        flex: 1 1 auto;
        font-size: 16px; font-weight: 600; line-height: 1.35;
        margin: 0 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-width: 0;
      }
      .lite-wrap {
        flex: 0 0 auto;
        display: flex; align-items: center;
        font-size: 15px; font-weight: 600;
        color: rgba(255,255,255,0.9);
      }
      .lite-btn {
        margin-left: 8px;
        min-height: 44px; min-width: 64px;
        font-size: 15px; font-weight: 700;
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.10);
        color: rgba(255,255,255,0.75);
        padding: 6px 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .lite-btn.on {
        background: #ffd166; color: #1a2436; border-color: #ffd166;
      }
      .art-frame {
        flex: 1 1 auto;
        width: 100%;
        border: none;
        background: #ffffff;
        min-height: 0;
      }
      .art-text {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #f7f5ef;
        color: #1c2432;
        font-size: 17px; line-height: 1.75;
        padding: 20px 22px 30px;
        white-space: pre-wrap;
        word-wrap: break-word;
        display: none;
        min-height: 0;
      }

      /* Short viewport (e.g. browser chrome eating into the 480px height):
         shrink the left column further so the weather strip always fits */
      @media (max-height: 460px) {
        .dash { padding: 10px 16px 8px 20px; }
        .clock { font-size: 74px; }
        .clock .sec { font-size: 26px; }
        .date-line { font-size: 22px; }
        .weather { margin-top: 9px; }
        .wx-icon { font-size: 38px; margin-right: 10px; }
        .wx-temp { font-size: 42px; }
        .wx-cond { font-size: 18px; }
        .wx-place { font-size: 12px; }
        .wx-hilo { font-size: 15px; margin-top: 5px; }
        .wx-hours { margin-top: 7px; }
        .wx-hour { padding: 4px 0 3px; }
        .wx-hour .h-time { font-size: 12px; }
        .wx-hour .h-icon { font-size: 17px; }
        .wx-hour .h-temp { font-size: 13px; }
        .tab { min-height: 40px; font-size: 15px; }
        .news-title { font-size: 15px; }
      }

      /* Narrow fallback (portrait previews): stack the blocks vertically */
      @media (max-width: 700px) {
        .dash { flex-direction: column; padding: 12px; }
        .left { width: 100%; padding-right: 0; flex: 0 0 auto; }
        .right { width: 100%; flex: 1 1 auto; margin-top: 10px; min-height: 0; }
        .clock { font-size: 64px; }
        .clock .sec { font-size: 24px; }
        .date-line { font-size: 20px; }
        .weather { margin-top: 10px; }
        .wx-temp { font-size: 42px; }
        .wx-icon { font-size: 40px; margin-right: 10px; }
        .wx-cond { font-size: 19px; }
        .wx-hilo { font-size: 16px; margin-top: 6px; }
        .wx-hours { margin-top: 8px; }
        .wx-hour .h-icon { font-size: 20px; }
        .wx-hour .h-temp { font-size: 14px; }
        .tab { font-size: 14px; min-height: 42px; }
        .news-title { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="bg-shade"></div>

    <!-- ============ DASHBOARD ============ -->
    <div class="dash" id="dash">
      <div class="left">
        <div class="clock"><span id="clock-main">--:--</span><span class="sec" id="clock-sec">--</span></div>
        <div class="date-line" id="date-line">読み込み中…</div>

        <div class="weather" id="weather">
          <div class="wx-now">
            <div class="wx-icon" id="wx-icon">⌛</div>
            <div class="wx-temp" id="wx-temp">--°</div>
            <div class="wx-side">
              <div class="wx-cond" id="wx-cond">天気を取得中</div>
              <div class="wx-place">葉山町（神奈川県）</div>
            </div>
          </div>
          <div class="wx-hilo" id="wx-hilo"></div>
          <div class="wx-hours" id="wx-hours"></div>
        </div>
      </div>

      <div class="right">
        <div class="panel">
          <div class="tabs" id="tabs">
            <button class="tab active" data-tab="stocks" type="button">株</button>
            <button class="tab" data-tab="ai" type="button">AI</button>
            <button class="tab" data-tab="it" type="button">IT</button>
            <button class="tab" data-tab="gadget" type="button">ガジェット</button>
          </div>
          <div class="news-list" id="news-list">
            <div class="news-msg">読み込み中…</div>
          </div>
          <div class="foot" id="foot">--:-- 更新</div>
        </div>
      </div>
    </div>

    <!-- ============ ARTICLE VIEW ============ -->
    <div class="article" id="article">
      <div class="art-bar">
        <button class="back-btn" id="back-btn" type="button">← 戻る</button>
        <div class="art-title" id="art-title"></div>
        <div class="lite-wrap">軽量表示
          <button class="lite-btn on" id="lite-btn" type="button">ON</button>
        </div>
      </div>
      <iframe class="art-frame" id="art-frame" title="記事"></iframe>
      <div class="art-text" id="art-text"></div>
    </div>

    <script>
      "use strict";

      /* ================= helpers ================= */
      function $(id) { return document.getElementById(id); }
      function pad2(n) { return (n < 10 ? "0" : "") + n; }
      function fetchJson(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.json();
        });
      }
      function fetchText(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) { throw new Error("HTTP " + res.status); }
          return res.text();
        });
      }

      /* ================= clock ================= */
      var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
      function tickClock() {
        var now = new Date();
        $("clock-main").textContent = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
        $("clock-sec").textContent = pad2(now.getSeconds());
        $("date-line").textContent =
          (now.getMonth() + 1) + "月" + now.getDate() + "日(" + WEEKDAYS[now.getDay()] + ")";
      }
      tickClock();
      setInterval(tickClock, 1000);

      /* ================= footer ================= */
      var lastUpdated = null;
      function markUpdated() {
        lastUpdated = new Date();
        $("foot").textContent = pad2(lastUpdated.getHours()) + ":" + pad2(lastUpdated.getMinutes()) + " 更新";
      }

      /* ================= weather (from the shared JSON, Hayama) ================= */
      function wxInfo(code) {
        if (code === 0) return { label: "晴れ", icon: "☀️" };
        if (code === 1) return { label: "ほぼ晴れ", icon: "🌤️" };
        if (code === 2) return { label: "晴れ時々くもり", icon: "⛅" };
        if (code === 3) return { label: "くもり", icon: "☁️" };
        if (code === 45 || code === 48) return { label: "霧", icon: "🌫️" };
        if (code === 51 || code === 53 || code === 55) return { label: "霧雨", icon: "🌦️" };
        if (code === 56 || code === 57) return { label: "着氷性の霧雨", icon: "🌦️" };
        if (code === 61) return { label: "雨", icon: "🌧️" };
        if (code === 63) return { label: "雨", icon: "🌧️" };
        if (code === 65) return { label: "強い雨", icon: "🌧️" };
        if (code === 66 || code === 67) return { label: "着氷性の雨", icon: "🌧️" };
        if (code === 71 || code === 73 || code === 75) return { label: "雪", icon: "❄️" };
        if (code === 77) return { label: "雪", icon: "🌨️" };
        if (code === 80 || code === 81 || code === 82) return { label: "にわか雨", icon: "🌦️" };
        if (code === 85 || code === 86) return { label: "にわか雪", icon: "🌨️" };
        if (code === 95) return { label: "雷雨", icon: "⛈️" };
        if (code === 96 || code === 99) return { label: "雷雨（雹）", icon: "⛈️" };
        return { label: "―", icon: "🌡️" };
      }

      /* Weather arrives inside the same JSON as the news (see loadNews);
         there is no direct fetch to a weather API. */
      function renderWeather(w) {
        if (!w || typeof w.temp !== "number" || typeof w.code !== "number") {
          $("wx-icon").textContent = "⚠️";
          $("wx-temp").textContent = "--°";
          $("wx-cond").textContent = "天気を取得できませんでした";
          $("wx-hilo").innerHTML = "";
          $("wx-hours").innerHTML = "";
          return;
        }
        var info = wxInfo(w.code);
        $("wx-icon").textContent = info.icon;
        $("wx-temp").textContent = Math.round(w.temp) + "°";
        $("wx-cond").textContent = info.label;

        if (typeof w.max === "number" && typeof w.min === "number") {
          $("wx-hilo").innerHTML =
            "今日の最高 <span class=\"hi\">" + Math.round(w.max) + "°</span> ／ 最低 <span class=\"lo\">" + Math.round(w.min) + "°</span>";
        } else {
          $("wx-hilo").innerHTML = "";
        }

        var html = "";
        var hours = w.hours || [];
        for (var i = 0; i < hours.length && i < 6; i++) {
          var h = hours[i];
          var dt = new Date(h.time);
          var hInfo = wxInfo(h.code);
          var hLabel = isNaN(dt.getTime()) ? "" : dt.getHours() + "時";
          html += "<div class=\"wx-hour\">"
            + "<div class=\"h-time\">" + hLabel + "</div>"
            + "<div class=\"h-icon\">" + hInfo.icon + "</div>"
            + "<div class=\"h-temp\">" + Math.round(h.temp) + "°</div>"
            + "</div>";
        }
        $("wx-hours").innerHTML = html;
      }

      /* ============ news + weather (JSON bundled with this page) ============
         The data ships inside the artifact itself and is fetched via a
         same-origin relative path, so no cross-origin request is involved. */
      var NEWS_URL = "assets/dashboard-data.json";
      /* tab key -> key inside the JSON's "feeds" object */
      var TAB_KEYS = { stocks: "kabu", ai: "ai", it: "it", gadget: "gadget" };
      var ERR_MSG = "読み込みに失敗しました。しばらくしてからタブを切り替えてください";
      /* tab key -> processed items; replaced wholesale on each successful
         fetch. On failure the previous data is kept; the error message only
         shows when nothing has ever loaded. */
      var newsData = {};
      var newsLoaded = false;
      var newsLoading = false;
      var activeTab = "stocks";

      function parseNewsDate(s) {
        if (!s) return null;
        var d = new Date(s); /* ISO 8601 string */
        if (isNaN(d.getTime())) return null;
        return d;
      }

      function relTime(d) {
        if (!d) return "";
        var diffMs = new Date().getTime() - d.getTime();
        if (diffMs < 0) diffMs = 0;
        var min = Math.floor(diffMs / 60000);
        if (min < 1) return "たった今";
        if (min < 60) return min + "分前";
        var hr = Math.floor(min / 60);
        if (hr < 24 && d.getDate() === new Date().getDate()) return hr + "時間前";
        return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }

      function processItems(rawItems, isStocks) {
        /* the JSON is already newest-first: keep the array order, cap at 12 */
        var out = [];
        for (var i = 0; i < rawItems.length && out.length < 12; i++) {
          var it = rawItems[i];
          var title = it.title || "";
          var source = "";
          if (isStocks) {
            var idx = title.lastIndexOf(" - ");
            if (idx > 0) {
              source = title.substring(idx + 3);
              title = title.substring(0, idx);
            }
          }
          if (!title || !it.link) continue;
          out.push({
            title: title,
            link: it.link,
            source: source,
            date: parseNewsDate(it.date)
          });
        }
        return out;
      }

      function renderNews(key) {
        var list = $("news-list");
        if (!newsLoaded) {
          list.innerHTML = "<div class=\"news-msg\">" + (newsLoading ? "読み込み中…" : ERR_MSG) + "</div>";
          return;
        }
        var items = newsData[key] || [];
        if (!items.length) {
          list.innerHTML = "<div class=\"news-msg\">記事がありません</div>";
          return;
        }
        list.innerHTML = "";
        for (var i = 0; i < items.length; i++) {
          (function (item) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "news-item";
            var titleEl = document.createElement("div");
            titleEl.className = "news-title";
            titleEl.textContent = item.title;
            var metaEl = document.createElement("div");
            metaEl.className = "news-meta";
            var timeEl = document.createElement("span");
            timeEl.textContent = relTime(item.date);
            metaEl.appendChild(timeEl);
            if (item.source) {
              var srcEl = document.createElement("span");
              srcEl.className = "news-src";
              srcEl.textContent = item.source;
              metaEl.appendChild(srcEl);
            }
            btn.appendChild(titleEl);
            btn.appendChild(metaEl);
            btn.addEventListener("click", function () { openArticle(item); });
            list.appendChild(btn);
          })(items[i]);
        }
        list.scrollTop = 0;
      }

      function loadNews() {
        if (newsLoading) return;
        newsLoading = true;
        /* cache-busting query so reloads and the 10-min refresh always
           fetch the freshest data file instead of a cached copy */
        var url = NEWS_URL + "?v=" + new Date().getTime();
        fetchJson(url).then(function (d) {
          if (!d || !d.feeds) { throw new Error("bad news json"); }
          var next = {};
          for (var key in TAB_KEYS) {
            next[key] = processItems(d.feeds[TAB_KEYS[key]] || [], key === "stocks");
          }
          newsData = next;
          newsLoaded = true;
          newsLoading = false;
          renderNews(activeTab);
          renderWeather(d.weather);
          markUpdated();
        }).catch(function () {
          newsLoading = false;
          /* keep the previous data; only when nothing has ever loaded,
             show the error states (news message + weather error, so the
             weather block never stays stuck on its loading display) */
          if (!newsLoaded) {
            renderNews(activeTab);
            renderWeather(null);
          }
        });
      }

      function selectTab(key) {
        activeTab = key;
        var tabs = $("tabs").children;
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].getAttribute("data-tab") === key) {
            tabs[i].className = "tab active";
          } else {
            tabs[i].className = "tab";
          }
        }
        renderNews(key);
      }

      (function bindTabs() {
        var tabs = $("tabs").children;
        for (var i = 0; i < tabs.length; i++) {
          (function (el) {
            el.addEventListener("click", function () {
              selectTab(el.getAttribute("data-tab"));
            });
          })(tabs[i]);
        }
      })();

      /* initial load + refresh of all tabs every 10 minutes */
      loadNews();
      setInterval(loadNews, 10 * 60 * 1000);

      /* ================= article view ================= */
      var currentItem = null;
      var liteMode = false;
      var idleTimer = null;

      function resetIdleTimer() {
        if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
        if ($("article").className.indexOf("open") >= 0) {
          idleTimer = setTimeout(closeArticle, 60 * 1000);
        }
      }

      function applyArticleContent() {
        var frame = $("art-frame");
        var text = $("art-text");
        if (!currentItem) return;
        if (liteMode) {
          frame.style.display = "none";
          frame.src = "about:blank";
          text.style.display = "block";
          text.textContent = "軽量表示で読み込み中…";
          var url = "https://r.jina.ai/" + currentItem.link;
          fetchText(url).then(function (body) {
            if (!liteMode || !currentItem) return;
            /* reader services prepend page metadata (Title:/URL Source:/
               Markdown Content:); skip straight to the article body */
            var marker = "Markdown Content:";
            var idx = body.indexOf(marker);
            if (idx >= 0) { body = body.slice(idx + marker.length); }
            text.textContent = body.replace(/^\s+/, "");
            text.scrollTop = 0;
          }).catch(function () {
            if (!liteMode || !currentItem) return;
            text.textContent = "軽量表示の読み込みに失敗しました。通常表示をお試しください。";
          });
        } else {
          text.style.display = "none";
          frame.style.display = "block";
          frame.src = currentItem.link;
        }
      }

      function openArticle(item) {
        currentItem = item;
        /* articles open in the lightweight text view by default:
           many publisher pages refuse to be embedded in a frame
           (X-Frame-Options), which shows as ERR_BLOCKED_BY_RESPONSE,
           and the text reader works for every source */
        liteMode = true;
        var btn = $("lite-btn");
        btn.textContent = "ON";
        btn.className = "lite-btn on";
        $("art-title").textContent = item.title;
        $("article").className = "article open";
        applyArticleContent();
        resetIdleTimer();
      }

      function closeArticle() {
        if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
        $("article").className = "article";
        $("art-frame").src = "about:blank";
        currentItem = null;
      }

      $("back-btn").addEventListener("click", closeArticle);
      $("lite-btn").addEventListener("click", function () {
        liteMode = !liteMode;
        this.textContent = liteMode ? "ON" : "OFF";
        this.className = liteMode ? "lite-btn on" : "lite-btn";
        applyArticleContent();
        resetIdleTimer();
      });

      /* any touch inside the article view (outside the iframe content)
         resets the 60 s auto-return timer */
      var artEl = $("article");
      artEl.addEventListener("touchstart", resetIdleTimer, { passive: true });
      artEl.addEventListener("mousedown", resetIdleTimer);
      artEl.addEventListener("wheel", resetIdleTimer);

      /* ================= whole-page auto reload (6 h) ================= */
      setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
    </script>
  </body>
</html>
